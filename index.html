<script>
const items=['Käyttöönotto suunnitelma','Väestönsuojan opaste- ja merkintäsarja','Käsivalaisin','Vesiastiat ja varavesisäilytys','Paristot AA','Paristot AAA','Paristot D','Paristo muu?','Rautakanki','Taittopaarit kantohihnoilla','Huopa tai lämpöpeite','Suojan työkalusarja','Väestönsuojan huolto ja käyttöopas','Käymälät ja varusteet','Käymälän kemikaalit','Pajavasara 2 kg','Katkaisutaltta 300 mm','Piikkitaltta 300 mm','Linjapihdit','Voimaleikkuri 600 mm','Veistokirves 400 mm','Kenttälapio','Sorkkarauta','Käsisaha','Rautasaha','Rautasahan terät','Jakoavain','Ruuvitaltta','Ristipääruuvitaltta','Kirvesmiehen vasara','Naulat','Puukko','Pelastusköysi','Kiintoavainsarja','Putkipihdit','Ensiside','Suojakypärä','Suojalasit','Suojapuku ja kumisaappaat','Suojanaamari','Suodatin patruuna','Huomioliivi tai käsivarsinauha','Talon turvaopas','Ensiapulaukku','Palosanko','Sankoruisku tai käsisammutin','Sammutuspeite','Vedensäilytysaine','Joditabletit','Säteilymittari (yli 100 hengen suojiin)','Käyttöönotto onnistuu 72h?'];
const rows=document.getElementById('rows'),opts='<option value=""></option>'+Array.from({length:100},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');items.forEach((x,i)=>rows.insertAdjacentHTML('beforeend',`<tr><td>${x}</td><td><select data-k="q${i}">${opts}</select></td><td class="choice"><label><input type="checkbox" data-k="y${i}">Kyllä</label><label><input type="checkbox" data-k="n${i}">Ei</label></td><td><input type="text" data-k="h${i}"></td></tr>`));
const KEY='huoltokopla-vss-47-report',NAMES='huoltokopla-vss-inspectors';function names(){try{return JSON.parse(localStorage.getItem(NAMES)||'[]')}catch{return[]}}function loadNames(sel=''){inspector.innerHTML='<option value="">Valitse tarkastaja</option>';names().forEach(n=>inspector.add(new Option(n,n)));inspector.value=sel}function current(){const d={property:property.value,address:address.value,inspector:inspector.value,date:date.value,general:general.value,fields:{}};document.querySelectorAll('[data-k]').forEach(e=>d.fields[e.dataset.k]=e.type==='checkbox'?e.checked:e.value);return d}function save(){localStorage.setItem(KEY,JSON.stringify(current()))}function load(){let d={};try{d=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};loadNames(d.inspector||'');property.value=d.property||'';address.value=d.address||'';date.value=d.date||'';general.value=d.general||'';Object.entries(d.fields||{}).forEach(([k,v])=>{const e=document.querySelector(`[data-k="${k}"]`);if(e)e.type==='checkbox'?e.checked=!!v:e.value=v})}document.addEventListener('input',save);document.addEventListener('change',e=>{if(e.target.type==='checkbox'&&e.target.dataset.k){const k=e.target.dataset.k,i=k.slice(1),other=document.querySelector(`[data-k="${k[0]==='y'?'n':'y'}${i}"]`);if(e.target.checked&&other)other.checked=false}save()});add.onclick=()=>{let n=prompt('Anna tarkastajan nimi:');if(!n||!n.trim())return;n=n.trim();const a=names();if(!a.includes(n)){a.push(n);a.sort((x,y)=>x.localeCompare(y,'fi'));localStorage.setItem(NAMES,JSON.stringify(a))}loadNames(n);save()};remove.onclick=()=>{const n=inspector.value;if(!n)return;localStorage.setItem(NAMES,JSON.stringify(names().filter(x=>x!==n)));loadNames('');save()};clear.onclick=()=>{if(confirm('Tyhjennetäänkö koko raportti? Tarkastajien nimilista säilytetään.')){localStorage.removeItem(KEY);location.reload()}};function safe(s){return(s||'osoite').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').slice(0,100)}pdf.onclick=()=>{save();const old=document.title;document.title='Väestönsuojan tarvikelista '+safe(address.value);window.print();setTimeout(()=>document.title=old,1000)};load();
</script></body></html>
